<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogPost</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <form action="">
        <label for="title">Post Title: </label>
        <input type="title" placeholder="Enter your Post Title" required><br><br>
        <label for="category">Category: </label>
        <select name="topic" id="topic" required>
            <option value="">Select your topic of intrest</option>
            <option value="cars">Cars</option>
            <option value="Food and drinks">Food and drinks</option>
  <option value="Lifestyle">Lifestyle</option>
  <option value="Culture">Culture</option>
  <option value="Business">Business</option>
  <option value="Finance">Finance</option>
  <option value="Technology">Technology</option>
  <option value="Sports">Sports</option>
  <option value="art">Art</option>
  <option value="Music">Music</option>
  <option value="health and fitness">Health and fitness</option>
  <option value="Spirituality">Spirituality</option>
  <option value="Fiction">Fiction</option>
  <option value="Other">Other</option>
  </select><br><br>
        <label for="image">Freatured Image: </label>
        <input type="file" id="Featured Image" accept="image/*" ><br><br>
        <label for="body">Message: </label>
 <textarea name="body" id="content" cols="30" rows="10" placeholder="Enter your content" required></textarea><br><br>
<style>
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: 0.4s;
  border-radius: 34px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: rgb(255, 255, 255);
  transition: 0.4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: #2196F3;
}

input:checked + .slider:before {
  transform: translateX(26px);
}
</style>
<label for="draft">Draft </label>
<label class="switch">
  <input type="checkbox">
  <span class="slider"></span>
</label>
<label for="publish"> Publish</label><br><br>
<label for="allow commenting">Allow Commenting</label>
<input type="checkbox" checked required><br><br>
<label for="date">Publish Date: </label>
<input type="datetime-local" required><br><br>
<button type="button">Submit Post</button>
    </form>
     <p><small><a href="signup.html" onclick="showSignUp(); return false;">← Back to Sign Up</a> | <a href="signin.html" onclick="showSignIn(); return false;">Sign In instead</a></small></p>
</body>
</html>
