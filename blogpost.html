<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Post — Inkwell</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <a href="signup.html" class="wordmark">Ink<span>well</span></a>
    <span class="tagline">Your words, your world</span>
  </header>

  <main class="wide">
    <section class="card-header">
      <h1>Write a new post</h1>
      <p>Share your ideas with the Inkwell community.</p>
    </section>

    <form action="submit.html" method="get">

      <fieldset>
        <label for="post-title">Post Title</label>
        <input type="text" id="post-title" name="title"
               placeholder="Give your post a compelling title…" required />
      </fieldset>

      <fieldset>
        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="">Select a topic…</option>
          <option value="cars">Cars</option>
          <option value="food-drinks">Food &amp; Drinks</option>
          <option value="lifestyle">Lifestyle</option>
          <option value="culture">Culture</option>
          <option value="business">Business</option>
          <option value="finance">Finance</option>
          <option value="technology">Technology</option>
          <option value="sports">Sports</option>
          <option value="art">Art</option>
          <option value="music">Music</option>
          <option value="health-fitness">Health &amp; Fitness</option>
          <option value="spirituality">Spirituality</option>
          <option value="fiction">Fiction</option>
          <option value="other">Other</option>
        </select>
      </fieldset>

      <fieldset>
        <label for="featured-image">Featured Image</label>
        <input type="file" id="featured-image" name="featured_image" accept="image/*" />
      </fieldset>

      <fieldset>
        <label for="content">Post Content</label>
        <textarea id="content" name="content"
                  placeholder="Write your story here…" required></textarea>
      </fieldset>

      <hr />

      <p class="toggle-row">
        <label for="publish-toggle" id="label-draft" class="active">Draft</label>
        <label class="switch">
          <input type="checkbox" id="publish-toggle" name="published"
                 onchange="document.getElementById('label-draft').classList.toggle('active',!this.checked);
                           document.getElementById('label-publish').classList.toggle('active',this.checked);" />
          <span class="slider"></span>
        </label>
        <label for="publish-toggle" id="label-publish">Publish</label>
      </p>

      <p class="check-row">
        <input type="checkbox" id="allow-comments" name="allow_comments" checked />
        <label for="allow-comments">Allow commenting on this post</label>
      </p>

      <fieldset>
        <label for="publish-date">Publish Date &amp; Time</label>
        <input type="datetime-local" id="publish-date" name="publish_date" />
      </fieldset>

      <button type="submit">Submit Post →</button>
    </form>
  </main>

  <footer>
    <p>
      <a href="signup.html">← Back to Sign Up</a>
      &nbsp;·&nbsp;
      <a href="signin.html">Sign In instead</a>
    </p>
  </footer>

</body>
</html>
