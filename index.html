    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <form action="">
<label for="name">Full Name: </label>
<input type="name" placeholder="Enter your Full Name" required><br><br>

<input type="email" placeholder= "Enter your Email Address" required><br><br>
<label for="number">Phone Number: </label>
<input type= "phonenumber" placeholder="Enter your Phone Number" required><br><br>

<input type="subject" placeholder="Enter the Subject" required><br><br>
<label for="message">Message: </label>
 <textarea name="message" id="message" cols="30" rows="10" placeholder="Enter your message" required></textarea><br><br>
 <button type="submit">Send Message</button><br><br>

    </form>
