<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <form action="">
<label for="name">Full Name: </label>
<input type="name" placeholder="Enter your Full Name" required><br><br>
<label for="username">Username: </label>
<input type="username" placeholder="Enter your Username" required><br><br> 
<label for="email">Email Address: </label>
<input type="email" placeholder= "Enter your Email Address" required><br><br>
<label for="number">Phone Number: </label>
<input type= "phonenumber" placeholder="Enter your Phone Number" required><br><br>
<label for="password">Input Password: </label>
<input type="password" placeholder="Enter your Password" required><br><br>
<label for="password">Confirm Password: </label>
<input type="password" placeholder="Confirm your Password" required><br><br>
<label for="url">Profile Picture: </label>
<input type="file" id="profile-upload" name="avatar" accept="image/*"><br><br>
<label for="Terms and Conditions">Terms and Conditions: </label>
<input type="checkbox" required><br><br>
<button type="submit" onclick="window.location.href='signin.html'">Sign Up</button>
</form>
  <p><small>Already have an account? <a href="signin.html">Sign in here</a></small></p>
</body>
</html>
