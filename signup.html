<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — Inkwell</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <a href="signup.html" class="wordmark">Ink<span>well</span></a>
    <span class="tagline">Your words, your world</span>
  </header>

  <main>
    <section class="card-header">
      <h1>Create account</h1>
      <p>Join thousands of writers sharing their stories.</p>
    </section>

    <form action="blogpost.html" method="get">

      <fieldset class="row-2">
        <fieldset>
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full_name"
                 placeholder="Kyle Tarus" required />
        </fieldset>
        <fieldset>
          <label for="username">Username</label>
          <input type="text" id="username" name="username"
                 placeholder="Crazynuke" required />
        </fieldset>
      </fieldset>

      <fieldset>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="name@example.com" required />
      </fieldset>

      <fieldset>
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="+254 700 000 000" />
      </fieldset>

      <fieldset class="row-2">
        <fieldset>
          <label for="password">Password</label>
          <input type="password" id="password" name="password"
                 placeholder="••••••••" required />
        </fieldset>
        <fieldset>
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm_password"
                 placeholder="••••••••" required />
        </fieldset>
      </fieldset>

      <fieldset>
        <label for="avatar">Profile Picture</label>
        <input type="file" id="avatar" name="avatar" accept="image/*" />
      </fieldset>

      <p class="check-row">
        <input type="checkbox" id="terms" name="terms" required />
        <label for="terms">
          I agree to the <a href="#">Terms &amp; Conditions</a> and
          <a href="#">Privacy Policy</a>
        </label>
      </p>

      <button type="submit">Create My Account →</button>
    </form>
  </main>

  <footer>
    <p>Already have an account? <a href="signin.html">Sign in here</a></p>
  </footer>

</body>
</html>
