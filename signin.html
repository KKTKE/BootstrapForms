<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Inkwell</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <a href="signup.html" class="wordmark">Ink<span>well</span></a>
    <span class="tagline">Your words, your world</span>
  </header>

  <main>
    <section class="card-header">
      <h1>Welcome back</h1>
      <p>Sign in to continue writing and reading.</p>
    </section>

    <form action="blogpost.html" method="get">

      <fieldset>
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="name@example.com" required />
      </fieldset>

      <fieldset>
        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" required />
      </fieldset>

      <p class="forgot">
        <a href="#">Forgot password?</a>
      </p>

      <button type="submit">Sign In →</button>
    </form>
  </main>

  <footer>
    <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
  </footer>

</body>
</html>
